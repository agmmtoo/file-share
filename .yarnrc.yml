# Pinned so local, GitHub Actions, and Cloudflare Workers Builds all resolve the
# same Yarn. The Workers Builds image defaults to yarn 4.x, which refuses to
# migrate a v1 lockfile during an immutable install.
yarnPath: .yarn/releases/yarn-4.9.1.cjs

# Vite, wrangler, and eslint expect a real node_modules tree; PnP (the Yarn 4
# default) breaks their resolution.
nodeLinker: node-modules
